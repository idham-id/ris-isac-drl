# Diagnostik Fase 1: E1 pada kedalaman pantulan yang sudah konvergen.
#
# base.yaml memakai max_depth = 3 sesuai docs/EXPERIMENT_DESIGN.md §8. Uji
# konvergensi (docs/LOG.md 2026-11-10, Fase 1 revisi) menunjukkan median
# |h_d|^2 di ROI masih bergerak 35 dB antara kedalaman 3 dan 5, dan baru
# stabil pada 5-6. Override ini dipakai untuk mengukur ulang E1 pada
# kedalaman yang sahih, TANPA mengubah parameter resmi di base.yaml.
defaults: [base]

ray_tracing:
  max_depth: 6
