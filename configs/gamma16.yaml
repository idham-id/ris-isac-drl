# E4b (docs/EXPERIMENT_DESIGN.md Sec 7): M1 dilatih ulang pada Gamma = 16 dB.
# Hanya ambang SCNR yang berubah; seluruh kanal identik dengan base, sehingga
# channel_config_hash tidak berubah dan basis data HDF5 dipakai ulang.
defaults: [base]

experiment:
  name: gamma16

sensing:
  scnr_threshold_db: 16.0
